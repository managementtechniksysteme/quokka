services:
  php-fpm:
    build:
      args:
        user: quokka
        uid: 1000
      context: ./
      dockerfile: docker/php-fpm/Dockerfile
      target: base
    image: php-fpm-laravel-latex
    container_name : quokka-php-fpm
    hostname: php-fpm
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'php-fpm: master process'"]
      interval: 30s
      timeout: 3s
      retries: 3
    working_dir: /var/www/
    volumes:
      - ./:/var/www:z
    networks:
      - quokka

  queue-worker:
    build:
      args:
        user: quokka
        uid: 1000
      context: ./
      dockerfile: docker/php-fpm/Dockerfile
      target: base
    image: php-fpm-laravel-latex
    container_name : quokka-queue-worker
    # --max-time bounds each worker process to an hour before it exits
    # gracefully; restart: unless-stopped relaunches it immediately -- the
    # standard containerized-queue-worker pattern for capping memory growth
    # without needing a process supervisor like Supervisord inside the image.
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --memory=512
    hostname: queue-worker
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Reaps zombies from any queued job that shells out to a subprocess (this
    # app's own pdflatex/pandoc PDF generation, if ever dispatched via a job
    # rather than run synchronously) -- there's nothing else to do that over
    # a long-lived worker's full --max-time lifetime otherwise.
    init: true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work'"]
      interval: 30s
      timeout: 3s
      retries: 3
    working_dir: /var/www/
    volumes:
      - ./:/var/www:z
    networks:
      - quokka

  schedule-worker:
    build:
      args:
        user: quokka
        uid: 1000
      context: ./
      dockerfile: docker/php-fpm/Dockerfile
      target: base
    image: php-fpm-laravel-latex
    container_name : quokka-schedule-worker
    command: php artisan schedule:work
    hostname: queue-worker
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work'"]
      interval: 30s
      timeout: 3s
      retries: 3
    working_dir: /var/www/
    volumes:
      - ./:/var/www:z
    networks:
      - quokka

  php-fpm-dev:
    build:
      args:
        user: quokka
        uid: 1000
      context: ./
      dockerfile: docker/php-fpm/Dockerfile
      target: dev
    image: php-fpm-laravel-latex-dev
    container_name: quokka-php-fpm-dev
    hostname: php-fpm-dev
    restart: unless-stopped
    init: true
    profiles:
      - dev
    command: tail -f /dev/null
    working_dir: /var/www/
    volumes:
      - ./:/var/www:z
    networks:
      - quokka

  nodejs:
    image: node:22.23.1
    container_name: quokka-nodejs
    # Runs Vite's dev server automatically -- previously had no command at
    # all (bare node REPL), so restart: unless-stopped kept the container
    # alive but never actually brought Vite back up after a recreate,
    # silently leaving pages unstyled until someone noticed and ran
    # `npm run dev` by hand (2026-07-28, found while verifying this refactor).
    command: npm run dev
    hostname: nodejs
    restart: unless-stopped
    tty: true
    working_dir: /root
    environment:
      VITE_HOST: ${VITE_HOST:-localhost}
    ports:
      - 5173:5173
    volumes:
      - ./:/root:z
    networks:
      - quokka

  mariadb:
    image: mariadb:11.4.12
    container_name: quokka-mariadb
    hostname: mariadb
    restart: unless-stopped
    # DB_* keys are the real ones Laravel's own .env defines (and this app
    # already connects with) -- MARIADB_* never existed anywhere, so these
    # were silently blank. MYSQL_ROOT_PASSWORD has no Laravel-side
    # equivalent at all, so it lives in .env.docker instead (see env_file
    # below) rather than Laravel's .env, and is no longer the hardcoded
    # literal "admin" it was.
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    env_file:
      - .env.docker
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - 3306:3306
    volumes:
      - ./docker/mariadb/data:/var/lib/mysql:z
    networks:
      - quokka

  caddy:
    image: caddybuilds/caddy-cloudflare:2.11.4-alpine
    container_name: quokka-caddy
    hostname: caddy
    restart: unless-stopped
    depends_on:
      php-fpm:
        condition: service_healthy
    # CF_API_TOKEN is only actually read once Caddyfile.prod (which
    # references it) is the one mounted below -- harmless to always supply.
    env_file:
      - .env.docker
    ports:
      - 8001:80
    volumes:
      - ./:/var/www
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:z
    networks:
      - quokka

  redis:
    image: redis:7.4.10-alpine
    container_name: quokka-redis
    hostname: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - quokka

  mailpit:
    image: axllent/mailpit:v1.30.5
    container_name: quokka-mailpit
    hostname: mailpit
    restart: unless-stopped
    profiles:
      - mail
    ports:
      - 8002:8025
    networks:
      - quokka

networks:
  quokka:
    driver: bridge
