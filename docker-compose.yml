services:
  php-fpm:
    build:
      args:
        user: quokka
        uid: 1000
      context: ./
      dockerfile: docker/php-fpm/Dockerfile
      target: base
    image: php-fpm-laravel-latex
    container_name : quokka-php-fpm
    hostname: php-fpm
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www:z
    networks:
      - quokka

  queue-worker:
    build:
      args:
        user: quokka
        uid: 1000
      context: ./
      dockerfile: docker/php-fpm/Dockerfile
      target: base
    image: php-fpm-laravel-latex
    container_name : quokka-queue-worker
    command: php artisan queue:work
    hostname: queue-worker
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www:z
    networks:
      - quokka

  schedule-worker:
    build:
      args:
        user: quokka
        uid: 1000
      context: ./
      dockerfile: docker/php-fpm/Dockerfile
      target: base
    image: php-fpm-laravel-latex
    container_name : quokka-schedule-worker
    command: php artisan schedule:work
    hostname: queue-worker
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www:z
    networks:
      - quokka

  php-fpm-dev:
    build:
      args:
        user: quokka
        uid: 1000
      context: ./
      dockerfile: docker/php-fpm/Dockerfile
      target: dev
    image: php-fpm-laravel-latex-dev
    container_name: quokka-php-fpm-dev
    hostname: php-fpm-dev
    restart: unless-stopped
    init: true
    profiles:
      - dev
    command: tail -f /dev/null
    working_dir: /var/www/
    volumes:
      - ./:/var/www:z
    networks:
      - quokka

  nodejs:
    image: node:22
    container_name: quokka-nodejs
    hostname: nodejs
    restart: unless-stopped
    tty: true
    working_dir: /root
    environment:
      VITE_HOST: ${VITE_HOST:-localhost}
    ports:
      - 5173:5173
    volumes:
      - ./:/root:z
    networks:
      - quokka

  mariadb:
    image: mariadb:11.4
    container_name: quokka-mariadb
    hostname: mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MARIADB_DATABASE}
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
      MYSQL_USER: ${MARIADB_USERNAME}
    ports:
      - 3306:3306
    volumes:
      - ./docker/mariadb/data:/var/lib/mysql:z
    networks:
      - quokka

  nginx:
    image: nginx:1.27-alpine
    container_name: quokka-nginx
    hostname: nginx
    restart: unless-stopped
    ports:
      - 8001:80
    volumes:
      - ./:/var/www
      - ./docker/nginx/config:/etc/nginx/conf.d:z
    networks:
      - quokka

  redis:
    image: redis:7-alpine
    container_name: quokka-redis
    hostname: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - quokka

  mailpit:
    image: axllent/mailpit:v1.30.5
    container_name: quokka-mailpit
    hostname: mailpit
    restart: unless-stopped
    profiles:
      - mail
    ports:
      - 8002:8025
    networks:
      - quokka

networks:
  quokka:
    driver: bridge
